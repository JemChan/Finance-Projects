<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>S&P 500 · Top 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #080b0f;
    --bg2:       #0d1117;
    --bg3:       #131a22;
    --border:    rgba(255,255,255,0.07);
    --border2:   rgba(255,255,255,0.12);
    --text:      #e8eaf0;
    --muted:     #6b7585;
    --dim:       #3a4150;
    --green:     #22c55e;
    --green-bg:  rgba(34,197,94,0.10);
    --red:       #ef4444;
    --red-bg:    rgba(239,68,68,0.10);
    --amber:     #f59e0b;
    --blue:      #60a5fa;
    --accent:    #7c6af7;
    --mono:      'IBM Plex Mono', monospace;
    --sans:      'Syne', sans-serif;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── LAYOUT ── */
  .page {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding-bottom: 1.75rem;
    border-bottom: 1px solid var(--border);
    gap: 1rem;
    flex-wrap: wrap;
  }
  .logo-area h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
    line-height: 1;
  }
  .logo-area h1 span { color: var(--accent); }
  .logo-area p {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 5px;
    letter-spacing: 0.4px;
    font-family: var(--mono);
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text {
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
  .status-text strong { color: var(--text); }
  #refreshBtn {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--muted);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 0.72rem;
    font-family: var(--sans);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.3px;
  }
  #refreshBtn:hover { border-color: var(--accent); color: var(--accent); }
  #refreshBtn svg { transition: transform 0.6s; }
  #refreshBtn.loading svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── SUMMARY CARDS ── */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 1.75rem 0;
  }
  .card {
    background: var(--bg2);
    padding: 1.1rem 1.25rem;
    position: relative;
  }
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: transparent;
    transition: background 0.2s;
  }
  .card.up::after  { background: var(--green); }
  .card.down::after { background: var(--red); }
  .card-label {
    font-size: 0.68rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    font-family: var(--mono);
    margin-bottom: 6px;
  }
  .card-val {
    font-size: 1.35rem;
    font-weight: 700;
    font-family: var(--mono);
    color: #fff;
    line-height: 1;
  }
  .card-val.up   { color: var(--green); }
  .card-val.down { color: var(--red); }
  .card-sub {
    font-size: 0.68rem;
    color: var(--muted);
    margin-top: 5px;
    font-family: var(--mono);
  }

  /* ── TABLE ── */
  .table-wrap {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead {
    background: var(--bg3);
    border-bottom: 1px solid var(--border2);
  }
  th {
    padding: 0.65rem 1rem;
    font-size: 0.65rem;
    font-family: var(--mono);
    font-weight: 500;
    color: var(--muted);
    text-align: right;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: color 0.15s;
  }
  th:first-child, th:nth-child(2) { text-align: left; }
  th:hover { color: var(--text); }
  th.active { color: var(--accent); }
  th .arr { margin-left: 3px; opacity: 0.5; }
  th.active .arr { opacity: 1; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }

  td {
    padding: 0.85rem 1rem;
    text-align: right;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--text);
    white-space: nowrap;
    vertical-align: middle;
  }
  td:first-child { text-align: left; }
  td:nth-child(2) { text-align: left; font-family: var(--sans); font-size: 0.78rem; color: var(--muted); }

  .rank-badge {
    display: inline-block;
    font-size: 0.6rem;
    color: var(--dim);
    font-family: var(--mono);
    width: 18px;
    margin-right: 4px;
    text-align: right;
  }
  .ticker-chip {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 500;
    font-family: var(--mono);
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: #fff;
    border-radius: 5px;
    padding: 2px 8px;
    letter-spacing: 0.5px;
  }

  .chg.up   { color: var(--green); }
  .chg.down { color: var(--red); }
  .chg.flat { color: var(--muted); }

  .badge {
    display: inline-block;
    border-radius: 5px;
    padding: 3px 7px;
    font-size: 0.72rem;
    font-family: var(--mono);
    font-weight: 500;
  }
  .badge.up   { background: var(--green-bg); color: var(--green); }
  .badge.down { background: var(--red-bg);   color: var(--red);   }
  .badge.flat { background: rgba(255,255,255,0.05); color: var(--muted); }

  /* ── SPARKLINE ── */
  .spark-cell { width: 72px; }
  .spark-cell svg { display: block; margin-left: auto; }

  /* ── DAY RANGE ── */
  .range-bar {
    display: flex; align-items: center; gap: 5px;
    justify-content: flex-end;
  }
  .range-track {
    position: relative;
    width: 56px; height: 3px;
    background: var(--bg3);
    border-radius: 2px;
  }
  .range-fill {
    position: absolute;
    left: 0; top: 0; height: 100%;
    background: var(--accent);
    border-radius: 2px;
  }
  .range-dot {
    position: absolute;
    top: 50%; transform: translate(-50%, -50%);
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--bg);
    box-shadow: 0 0 4px var(--accent);
  }
  .range-label {
    font-size: 0.6rem;
    color: var(--dim);
    font-family: var(--mono);
  }

  /* ── STATES ── */
  .state-row td {
    text-align: center;
    padding: 3rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid var(--border2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  .err-msg { color: var(--red); font-size: 0.78rem; }
  .retry-link { color: var(--accent); cursor: pointer; text-decoration: underline; margin-left: 6px; }

  /* ── FOOTER ── */
  footer {
    margin-top: 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  footer p {
    font-size: 0.67rem;
    color: var(--dim);
    font-family: var(--mono);
    letter-spacing: 0.3px;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--accent); }
  #countdown {
    font-size: 0.67rem;
    color: var(--dim);
    font-family: var(--mono);
  }
  #countdown span { color: var(--accent); }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .spark-cell, th:nth-child(7), th:nth-child(8) { display: none; }
    td:nth-child(7), td:nth-child(8) { display: none; }
  }
  @media (max-width: 520px) {
    th:nth-child(6), td:nth-child(6) { display: none; }
    .page { padding: 1rem; }
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <header>
    <div class="logo-area">
      <h1>S&amp;P 500 <span>·</span> Top 10</h1>
      <p>LIVE MARKET DATA · AUTO-REFRESH EVERY 60s</p>
    </div>
    <div class="header-right">
      <div style="display:flex;align-items:center;gap:7px">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-text" id="statusText">Connecting…</div>
      </div>
      <button id="refreshBtn" onclick="loadData()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Refresh
      </button>
    </div>
  </header>

  <!-- SUMMARY CARDS -->
  <div class="cards" id="cards">
    <div class="card"><div class="card-label">Loading</div><div class="card-val" style="color:var(--dim)">—</div></div>
  </div>

  <!-- TABLE -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sort('symbol')"   id="th-symbol">Ticker <span class="arr">↕</span></th>
          <th onclick="sort('name')"     id="th-name">Company <span class="arr">↕</span></th>
          <th onclick="sort('price')"    id="th-price">Price <span class="arr">↕</span></th>
          <th onclick="sort('change')"   id="th-change">Change <span class="arr">↕</span></th>
          <th onclick="sort('changePct')" id="th-changePct">% Chg <span class="arr">↕</span></th>
          <th onclick="sort('marketCap')" id="th-marketCap" class="active">Mkt Cap <span class="arr">↓</span></th>
          <th onclick="sort('volume')"   id="th-volume">Volume <span class="arr">↕</span></th>
          <th class="spark-cell">5D</th>
          <th>Day Range</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr class="state-row"><td colspan="9"><span class="spinner"></span>Fetching live data…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- FOOTER -->
  <footer>
    <p>Source: <a href="https://finance.yahoo.com" target="_blank">Yahoo Finance</a> via yfinance · Data may be delayed 15–20 min</p>
    <div id="countdown">Refresh in <span id="countNum">60</span>s</div>
  </footer>

</div>

<script>
let allData    = [];
let sortKey    = 'marketCap';
let sortDir    = -1;
let countdown  = 60;
let timer      = null;
let countTimer = null;

// ── FORMAT HELPERS ──────────────────────────────────────────────
function fmtPrice(n) {
  if (n == null) return '—';
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtChg(n) {
  if (n == null) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(2);
}
function fmtPct(n) {
  if (n == null) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}
function fmtCap(n) {
  if (n == null) return '—';
  if (n >= 1e12) return '$' + (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n / 1e9).toFixed(1) + 'B';
  return '$' + (n / 1e6).toFixed(0) + 'M';
}
function fmtVol(n) {
  if (n == null) return '—';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return n.toLocaleString();
}
function dir(n) {
  if (n == null) return 'flat';
  return n > 0 ? 'up' : n < 0 ? 'down' : 'flat';
}

// ── SPARKLINE ───────────────────────────────────────────────────
function sparkline(prices, isUp) {
  if (!prices || prices.length < 2) return '<svg width="72" height="28"></svg>';
  const W = 72, H = 28, pad = 3;
  const min = Math.min(...prices), max = Math.max(...prices);
  const range = max - min || 1;
  const xs = prices.map((_, i) => pad + (i / (prices.length - 1)) * (W - pad * 2));
  const ys = prices.map(v => H - pad - ((v - min) / range) * (H - pad * 2));
  const pts = xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const apts = [...xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`),
                `${(W - pad).toFixed(1)},${H}`, `${pad},${H}`].join(' ');
  const color = isUp ? '#22c55e' : '#ef4444';
  const fill  = isUp ? 'rgba(34,197,94,0.12)' : 'rgba(239,68,68,0.12)';
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <polygon points="${apts}" fill="${fill}" />
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

// ── RANGE BAR ───────────────────────────────────────────────────
function rangeBar(low, high, price) {
  if (low == null || high == null || price == null || high === low)
    return '<span style="color:var(--dim)">—</span>';
  const pct = Math.min(1, Math.max(0, (price - low) / (high - low)));
  return `<div class="range-bar">
    <span class="range-label">${low.toFixed(0)}</span>
    <div class="range-track">
      <div class="range-fill" style="width:${(pct * 100).toFixed(1)}%"></div>
      <div class="range-dot" style="left:${(pct * 100).toFixed(1)}%"></div>
    </div>
    <span class="range-label">${high.toFixed(0)}</span>
  </div>`;
}

// ── SUMMARY CARDS ───────────────────────────────────────────────
function renderCards(data) {
  const valid     = data.filter(d => !d.error);
  const gainers   = valid.filter(d => d.changePct > 0).length;
  const losers    = valid.filter(d => d.changePct < 0).length;
  const totalCap  = valid.reduce((s, d) => s + (d.marketCap || 0), 0);
  const avgPct    = valid.reduce((s, d) => s + (d.changePct || 0), 0) / (valid.length || 1);
  const best      = [...valid].sort((a, b) => (b.changePct || 0) - (a.changePct || 0))[0];
  const worst     = [...valid].sort((a, b) => (a.changePct || 0) - (b.changePct || 0))[0];

  document.getElementById('cards').innerHTML = `
    <div class="card">
      <div class="card-label">Total Mkt Cap</div>
      <div class="card-val">${fmtCap(totalCap)}</div>
      <div class="card-sub">top 10 combined</div>
    </div>
    <div class="card ${gainers >= losers ? 'up' : 'down'}">
      <div class="card-label">Gainers / Losers</div>
      <div class="card-val"><span class="${gainers > 0 ? 'up' : ''}" style="color:var(--green)">${gainers}</span> <span style="color:var(--dim)">·</span> <span style="color:var(--red)">${losers}</span></div>
      <div class="card-sub">out of ${valid.length} tracked</div>
    </div>
    <div class="card ${dir(avgPct)}">
      <div class="card-label">Avg Change</div>
      <div class="card-val ${dir(avgPct)}">${fmtPct(avgPct)}</div>
      <div class="card-sub">equal-weight avg</div>
    </div>
    <div class="card up">
      <div class="card-label">Best Today</div>
      <div class="card-val up" style="font-size:1rem">${best?.symbol || '—'}</div>
      <div class="card-sub">${fmtPct(best?.changePct)}</div>
    </div>
    <div class="card down">
      <div class="card-label">Worst Today</div>
      <div class="card-val down" style="font-size:1rem">${worst?.symbol || '—'}</div>
      <div class="card-sub">${fmtPct(worst?.changePct)}</div>
    </div>
  `;
}

// ── TABLE ───────────────────────────────────────────────────────
function renderTable(data) {
  const sorted = [...data].sort((a, b) => {
    const av = a[sortKey] ?? (sortDir === -1 ? -Infinity : Infinity);
    const bv = b[sortKey] ?? (sortDir === -1 ? -Infinity : Infinity);
    if (typeof av === 'string') return sortDir * av.localeCompare(bv);
    return sortDir * (bv - av);
  });

  document.getElementById('tbody').innerHTML = sorted.map((s, i) => {
    if (s.error) return `<tr>
      <td><span class="rank-badge">${i+1}</span><span class="ticker-chip">${s.symbol}</span></td>
      <td>${s.name}</td>
      <td colspan="7" class="err-msg" style="text-align:left">Error: ${s.error}</td>
    </tr>`;

    const d   = dir(s.changePct);
    const isUp = d === 'up';

    return `<tr>
      <td><span class="rank-badge">${i+1}</span><span class="ticker-chip">${s.symbol}</span></td>
      <td>${s.name}</td>
      <td>${fmtPrice(s.price)}</td>
      <td class="chg ${d}">${fmtChg(s.change)}</td>
      <td><span class="badge ${d}">${fmtPct(s.changePct)}</span></td>
      <td>${fmtCap(s.marketCap)}</td>
      <td>${fmtVol(s.volume)}</td>
      <td class="spark-cell">${sparkline(s.spark, isUp)}</td>
      <td>${rangeBar(s.dayLow, s.dayHigh, s.price)}</td>
    </tr>`;
  }).join('');
}

// ── SORT ────────────────────────────────────────────────────────
function sort(key) {
  if (sortKey === key) sortDir *= -1;
  else { sortKey = key; sortDir = -1; }
  document.querySelectorAll('th').forEach(t => {
    t.classList.remove('active');
    const a = t.querySelector('.arr');
    if (a) a.textContent = '↕';
  });
  const th = document.getElementById('th-' + key);
  if (th) {
    th.classList.add('active');
    const a = th.querySelector('.arr');
    if (a) a.textContent = sortDir === -1 ? '↓' : '↑';
  }
  renderTable(allData);
}

// ── FETCH ───────────────────────────────────────────────────────
async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('loading');
  document.getElementById('statusText').innerHTML = 'Fetching…';

  try {
    const res  = await fetch('/api/quotes');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.error) throw new Error(json.error);

    allData = json.data;

    renderCards(allData);
    renderTable(allData);

    const t = new Date(json.fetchedAt);
    document.getElementById('statusText').innerHTML =
      `<strong>Live</strong> · ${t.toLocaleTimeString()}`;
    document.getElementById('statusDot').style.background = 'var(--green)';
    document.getElementById('statusDot').style.boxShadow  = '0 0 6px var(--green)';

    startCountdown();
  } catch (err) {
    document.getElementById('tbody').innerHTML =
      `<tr class="state-row"><td colspan="9" class="err-msg">
        Failed to load: ${err.message}
        <span class="retry-link" onclick="loadData()">Retry</span>
      </td></tr>`;
    document.getElementById('statusDot').style.background = 'var(--red)';
    document.getElementById('statusDot').style.boxShadow  = '0 0 6px var(--red)';
    document.getElementById('statusText').innerHTML = 'Error';
  } finally {
    btn.classList.remove('loading');
  }
}

// ── AUTO-REFRESH COUNTDOWN ──────────────────────────────────────
function startCountdown() {
  clearInterval(countTimer);
  clearTimeout(timer);
  countdown = 60;
  document.getElementById('countNum').textContent = countdown;

  countTimer = setInterval(() => {
    countdown--;
    document.getElementById('countNum').textContent = Math.max(0, countdown);
    if (countdown <= 0) {
      clearInterval(countTimer);
      loadData();
    }
  }, 1000);
}

// ── INIT ────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
